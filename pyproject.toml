[project]
name = "formidable"
version = "0.1.0"
description = "Generate HTML forms from Pydantic models"
readme = "README.md"
authors = [
    { name = "Christian Klinger", email = "ck@novareto.de" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.11.1",
    "autoroutes",
    "beartype",
    "werkzeug>=3.1.3",
    "chameleon-rs>=0.1.56",
    "markupsafe>=3.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "fanstatic>=1.8",
    "js-jquery>=3.6.1",
    "pdbpp>=0.10.3",
    "pytest>=8.0",
]
